<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS · Vitals</title>
<style>
  :root { --cy:#5cd6ff; --dim:#0b2230; }
  * { box-sizing: border-box; margin: 0; }
  html,body { height: 100%; background: radial-gradient(900px 900px at 50% 50%, #06121c 0%, #02060b 75%);
    color: #bfe9ff; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; }
  /* corner HUD frame */
  .corner { position: fixed; width: 46px; height: 46px; border: 2px solid #14506e; opacity: .8; }
  .tl { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
  .tr { top: 18px; right: 18px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 18px; left: 18px; border-right: 0; border-top: 0; }
  .br { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }
  #title { position: fixed; top: 26px; left: 0; right: 0; text-align: center;
    letter-spacing: .5em; font-size: 13px; color: #7fd0f0; text-transform: uppercase; }
  #title small { display:block; letter-spacing:.3em; font-size:10px; color:#3d6e85; margin-top:6px; }
  .readout { position: fixed; font-size: 12px; line-height: 1.7; }
  .readout .k { color: #4f93b0; letter-spacing: .12em; }
  .readout .v { color: #d6f3ff; }
  #rd-left { bottom: 34px; left: 40px; }
  #rd-right { bottom: 34px; right: 40px; text-align: right; }
  #status { position: fixed; top: 0; right: 0; padding: 22px 26px; font-size: 11px; letter-spacing: .2em; color: #2ee6a6; }
  .off { color:#d4552b !important; }
</style>
</head>
<body>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div id="title">J.A.R.V.I.S<small>System Vitals</small></div>
  <div id="status">● LIVE</div>
  <div id="wrap"><canvas id="reactor"></canvas></div>
  <div class="readout" id="rd-left"></div>
  <div class="readout" id="rd-right"></div>

<script>
const cvs = document.getElementById("reactor");
const ctx = cvs.getContext("2d");
let W, H, S;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  S = Math.min(window.innerWidth, window.innerHeight) * 0.82;
  cvs.width = S * dpr; cvs.height = S * dpr;
  cvs.style.width = S + "px"; cvs.style.height = S + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = H = S;
}
window.addEventListener("resize", resize); resize();

// metric rings (outer -> inner). value 0..1, eased toward target.
const rings = [
  { key: "gpu",  label: "GPU", r: 0.43, val: 0, target: 0 },
  { key: "mem",  label: "MEM", r: 0.35, val: 0, target: 0 },
  { key: "cpu",  label: "CPU", r: 0.27, val: 0, target: 0 },
];

function hueFor(v) { return 195 - v * 165; }      // cyan(195) -> amber/red(30)
function colFor(v, a = 1) { return `hsla(${hueFor(v)},90%,60%,${a})`; }

let t = 0;
function draw() {
  t += 0.016;
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const R = S / 2;

  // rotating outer tick ring
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.05);
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * Math.PI * 2;
    const big = i % 6 === 0;
    const r1 = R * 0.49, r2 = R * (big ? 0.45 : 0.47);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    ctx.strokeStyle = big ? "#3f7e9c" : "#1d465c";
    ctx.lineWidth = big ? 2 : 1; ctx.stroke();
  }
  ctx.restore();

  // metric rings
  for (const ring of rings) {
    ring.val += (ring.target - ring.val) * 0.08;
    const rad = R * ring.r;
    // track
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(40,90,120,.30)"; ctx.lineWidth = R * 0.045; ctx.stroke();
    // value arc
    const start = -Math.PI / 2;
    const end = start + ring.val * Math.PI * 2;
    ctx.beginPath(); ctx.arc(cx, cy, rad, start, end);
    ctx.strokeStyle = colFor(ring.val); ctx.lineWidth = R * 0.045;
    ctx.lineCap = "round";
    ctx.shadowColor = colFor(ring.val, .9); ctx.shadowBlur = 22;
    ctx.stroke(); ctx.shadowBlur = 0;
    // label + pct at the arc head
    ctx.fillStyle = colFor(ring.val);
    ctx.font = `${Math.round(R*0.035)}px ui-monospace, monospace`;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(`${ring.label} ${Math.round(ring.val*100)}%`, cx + rad + R*0.05, cy - rad*0.0 - (rad));
  }

  // arc-reactor core: coil segments + glowing center
  const coreR = R * 0.18;
  ctx.save(); ctx.translate(cx, cy);
  const segs = 10;
  for (let i = 0; i < segs; i++) {
    const a0 = (i / segs) * Math.PI * 2 + t * 0.12;
    const a1 = a0 + (Math.PI * 2 / segs) * 0.62;
    const ri = coreR * 1.15, ro = coreR * 1.55;
    ctx.beginPath();
    ctx.arc(0, 0, ro, a0, a1);
    ctx.arc(0, 0, ri, a1, a0, true);
    ctx.closePath();
    ctx.fillStyle = "rgba(92,214,255,0.16)";
    ctx.strokeStyle = "rgba(120,225,255,0.55)"; ctx.lineWidth = 1.4;
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  // pulsing center
  const overall = (rings[0].val + rings[1].val + rings[2].val) / 3;
  const pulse = 0.92 + 0.08 * Math.sin(t * 2.2);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * pulse);
  g.addColorStop(0, "#eaffff");
  g.addColorStop(0.4, colFor(overall, 1));
  g.addColorStop(1, "rgba(20,90,130,0)");
  ctx.beginPath(); ctx.arc(cx, cy, coreR * pulse, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.shadowColor = colFor(overall, .9); ctx.shadowBlur = 40;
  ctx.fill(); ctx.shadowBlur = 0;

  requestAnimationFrame(draw);
}
draw();

// poll vitals
const rdL = document.getElementById("rd-left");
const rdR = document.getElementById("rd-right");
const statusEl = document.getElementById("status");
async function poll() {
  try {
    const v = await (await fetch("/api/vitals")).json();
    rings.find(r => r.key === "cpu").target = Math.min(1, (v.cpu || 0) / 100);
    rings.find(r => r.key === "mem").target = Math.min(1, (v.mem_pct || 0) / 100);
    const gpu = v.gpu || {};
    rings.find(r => r.key === "gpu").target = Math.min(1, (gpu.util || 0) / 100);
    statusEl.textContent = "● LIVE"; statusEl.classList.remove("off");

    rdL.innerHTML =
      `<div><span class="k">CPU</span> <span class="v">${(v.cpu||0).toFixed(0)}% · ${v.cpu_cores} cores</span></div>` +
      `<div><span class="k">LOAD</span> <span class="v">${v.load1}</span></div>` +
      `<div><span class="k">MEM</span> <span class="v">${v.mem_used_gb} / ${v.mem_total_gb} GB</span></div>`;
    rdR.innerHTML = gpu.util == null
      ? `<div class="k">GPU</div><div class="v">n/a</div>`
      : `<div><span class="k">GPU</span> <span class="v">${gpu.util.toFixed(0)}%</span></div>` +
        `<div><span class="k">VRAM</span> <span class="v">${(gpu.mem_used/1024).toFixed(1)} / ${(gpu.mem_total/1024).toFixed(1)} GB</span></div>` +
        `<div><span class="k">TEMP</span> <span class="v">${gpu.temp.toFixed(0)}°C</span></div>`;
  } catch (e) {
    statusEl.textContent = "● NO LINK"; statusEl.classList.add("off");
  }
}
poll(); setInterval(poll, 1500);
</script>
</body>
</html>
